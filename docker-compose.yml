services:

  weather-platform:

    build: .

    container_name: weather-platform

    working_dir: /app

    ports:
      - "80:5173"

    environment:
      - CHOKIDAR_USEPOLLING=true

    volumes:
      - .:/app
      - weather_node_modules:/app/node_modules

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    stdin_open: true
    tty: true

volumes:
  weather_node_modules: